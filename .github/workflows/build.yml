name: Build and Release Muso

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

jobs:
  build:
    name: Build unsigned release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Build unsigned FOSS release APK
        run: ./gradlew assembleFossRelease --stacktrace

      - name: Rename APK to Muso_v0.5.20_v1.apk
        run: |
          cp app/build/outputs/apk/foss/release/app-foss-release-unsigned.apk Muso_v0.5.20_v1.apk
          ls -lh Muso_v0.5.20_v1.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Muso_v0.5.20_v1
          path: Muso_v0.5.20_v1.apk

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v0.5.20-v1"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Muso_v0.5.20_v1.apk --clobber
          else
            gh release create "$TAG" Muso_v0.5.20_v1.apk \
              --title "Muso v0.5.20" \
              --notes "Muso v0.5.20 (unsigned release build).

          Echo-Music streaming/search/lyrics API stack port:
          - Streaming: VISIONOS -> ANDROID_VR 1.65.10 -> ANDROID_VR 1.43.32 -> IPADOS -> IOS fallback chain
          - Search: updated WEB_REMIX InnerTube client
          - Lyrics: YouLyPlus, Paxsenix, Unison, Better Lyrics, SimpMusic, LrcLib, KuGou providers"
          fi
